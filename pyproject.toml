[build-system]
requires = ["hatchling >= 1.26, astropy >= 7.1.0, tomlkit >= 0.13.3, tqdm >= 4.67.1"]
build-backend = "hatchling.build"
[project]
name = "psr_lib"
version = "0.0.1"
authors = [
  { name="Istomin Arseniy", email="istomin15arseniy@gmail.com" },
]
description = "A project with various radio pulsar related routines"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/IstominArseniy/pulsar_test_package"